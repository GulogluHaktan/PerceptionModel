[project]
name = "pfm"
version = "0.0.1"
description = "Self-evolving foundation model for edge perception (v0 skeleton)"
requires-python = ">=3.12,<3.13"
dependencies = ["torch", "torchvision", "timm", "transformers==4.57.*", "huggingface-hub>=0.34,<1.0", "accelerate", "einops", "open_clip_torch", "opencv-python-headless", "numpy", "pyyaml", "pillow", "tqdm"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pfm"]

[tool.pytest.ini_options]
pythonpath = ["src"]
